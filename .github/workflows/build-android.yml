name: Build Android

on:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: true
      channel:
        type: string
        default: 'prod'
  workflow_call:
    inputs:
      release:
        description: Sign the build and upload it as an artifact.
        type: boolean
        required: true
      channel:
        description: dev or prod
        type: string
        required: true

env:
  CHANNEL: ${{ inputs.channel || 'prod' }}

jobs:
  build:
    name: android ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ["apk"]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Flutter and deps
        uses: ./.github/actions/setup-flutter
        with:
          platform: android
          install-deps: true

      - name: Build TVPN APK
        run: |
          dart run slang
          flutter build apk --release --split-per-abi --no-tree-shake-icons --dart-define=CHANNEL=prod

      - name: Collect the APKs
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/TVPN-android-arm64.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/TVPN-android-arm7.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk out/TVPN-android-x86_64.apk || true

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVPN-Android-APK
          path: out/*.apk
